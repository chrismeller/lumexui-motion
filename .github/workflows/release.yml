name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Keeps a release PR open that bumps the version (the csproj's <Version>) and CHANGELOG from the
      # conventional commits merged since the last release. Merging that PR tags the release and creates the
      # GitHub release. PRs opened with GITHUB_TOKEN don't trigger other workflows, so CI won't run on the
      # release PR; set a RELEASE_PLEASE_TOKEN secret (a fine-grained PAT or GitHub App token) if it needs to.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing runs here rather than on a release event: a release created with GITHUB_TOKEN doesn't
  # trigger other workflows.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
          # The release tags, for scripts/pack-baseline.sh.
          fetch-depth: 0

      # The .NET SDK, Node and pnpm (mise.toml); the build bundles wwwroot/motion.js.
      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

      # Vitest unit tests for the interop module in src/Scripts. The build below reuses node_modules.
      - name: Test the JS module
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      # The same checks build.yml runs on every PR, against the release tag, so a broken bundle step or a failing
      # test can't publish a package.
      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # The last release, packed from its tag. The pack step compares the package against it and fails on an API
      # break (package validation, see the csproj).
      - name: Pack the package validation baseline
        run: scripts/pack-baseline.sh

      - name: Pack LumexUI.Motion
        run: dotnet pack src/LumexUI.Motion.csproj -c Release --no-build --output nupkgs

      - name: Check the package contents
        run: scripts/check-package.sh nupkgs/LumexUI.Motion.*.nupkg

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
