name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5

      # Builds the library and the tests. Also installs the JS dependencies and bundles wwwroot/motion.js
      # (see the csproj).
      - name: Build
        run: dotnet build -c Release

      # xunit.v3 on Microsoft.Testing.Platform (global.json selects it for dotnet test).
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/LumexUI.Motion.csproj -c Release --no-build --output nupkgs

      # Fails if the bundled motion.js or a target framework's DLL is missing from the package.
      - name: Check the package contents
        run: scripts/check-package.sh nupkgs/LumexUI.Motion.*.nupkg
