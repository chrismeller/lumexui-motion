name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5

      - name: Bundle the motion module
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check the committed bundle is current
        run: |
          if ! git diff --exit-code -- src/wwwroot; then
            echo "::error::src/wwwroot/motion.js is out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi

      - name: Build
        run: dotnet build src/LumexUI.Motion.csproj -c Release

      - name: Pack
        run: dotnet pack src/LumexUI.Motion.csproj -c Release --no-build --output nupkgs
