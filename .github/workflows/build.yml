name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5

      # Also installs the JS dependencies and bundles wwwroot/motion.js (see the csproj).
      - name: Build
        run: dotnet build src/LumexUI.Motion.csproj -c Release

      - name: Pack
        run: dotnet pack src/LumexUI.Motion.csproj -c Release --no-build --output nupkgs
