name: Build

# Runs on every PR whatever it changes: an update to a workflow, mise.toml, global.json or package.json can break
# the build without touching src/.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

      # Vitest unit tests for the interop module in src/Scripts. The build below reuses node_modules.
      - name: Test the JS module
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      # Builds the library and the tests. Also installs the JS dependencies and bundles wwwroot/motion.js
      # (see the csproj).
      - name: Build
        run: dotnet build -c Release

      # xunit.v3 on Microsoft.Testing.Platform (global.json selects it for dotnet test).
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/LumexUI.Motion.csproj -c Release --no-build --output nupkgs

      # Fails if the bundled motion.js or a target framework's DLL is missing from the package.
      - name: Check the package contents
        run: scripts/check-package.sh nupkgs/LumexUI.Motion.*.nupkg
