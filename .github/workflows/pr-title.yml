name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# default top-level permissions to be very restrictive for checkov. the job overrides with more permissions as needed.
permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: read

    steps:
      # PRs are squash-merged, so the title becomes the commit release-please reads on main.
      # release-please's own PR ("chore(main): release x.y.z") passes as a chore.
      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
